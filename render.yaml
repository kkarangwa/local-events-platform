# Render Blueprint for Gada Events: database, API and website.
# In Render: New > Blueprint > pick this repository.
databases:
  - name: gada-events-db
    databaseName: gada_events
    plan: free

services:
  - type: web
    name: gada-events-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/db-health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: gada-events-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false # set to the website URL, e.g. https://gada-events.onrender.com

  - type: web
    name: gada-events
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to the API URL, e.g. https://gada-events-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
